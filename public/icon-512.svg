<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background with warm off-white -->
  <rect width="512" height="512" rx="96" fill="#FAF9F6"/>

  <!-- Subtle warm gradient overlay -->
  <defs>
    <linearGradient id="warmGlow" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#B07D2E" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#B07D2E" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#warmGlow)"/>

  <!-- Thin elegant border frame -->
  <rect x="72" y="152" width="368" height="208" rx="6" stroke="#1A1A1A" stroke-width="4" fill="none"/>

  <!-- K - bold sans-serif -->
  <text x="108" y="308" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="130" letter-spacing="-3" fill="#1A1A1A">K</text>

  <!-- a - serif italic, warm accent color -->
  <text x="212" y="302" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="400" font-size="86" fill="#B07D2E">a</text>

  <!-- F - light sans-serif -->
  <text x="276" y="308" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-weight="200" font-size="130" letter-spacing="8" fill="#1A1A1A">F</text>

  <!-- Small accent dot -->
  <circle cx="256" cy="396" r="6" fill="#B07D2E" opacity="0.6"/>
</svg>
